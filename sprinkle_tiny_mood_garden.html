<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprinkle — Tiny Mood Garden</title>
<style>
  :root{
    --ink:#342b3f; --muted:#786d82; --cream:#fffaf3;
    --pink:#ffb7c9; --lav:#cdbdf5; --mint:#bcebd7; --yellow:#ffe49a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;
    color:var(--ink); background:
      radial-gradient(circle at 10% 15%,#ffe5ed 0 9%,transparent 10%),
      radial-gradient(circle at 90% 12%,#e7dcff 0 8%,transparent 9%),
      linear-gradient(135deg,#fff8f1,#f6f0ff);
    display:grid; place-items:center; padding:24px;
  }
  .app{width:min(920px,100%); background:rgba(255,255,255,.82); backdrop-filter:blur(12px);
    border:2px solid rgba(255,255,255,.9); border-radius:32px; padding:28px;
    box-shadow:0 24px 70px rgba(71,52,87,.15)}
  header{display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:22px}
  h1{margin:0; font-size:clamp(2rem,5vw,3.5rem); letter-spacing:-.05em}
  .sub{color:var(--muted); margin:5px 0 0}
  .streak{background:#fff4c9; border:2px solid #f5df92; padding:10px 14px; border-radius:18px; font-weight:800; white-space:nowrap}
  .garden{position:relative; height:430px; overflow:hidden; border-radius:26px;
    background:linear-gradient(#dff6ff 0 58%,#c8efc8 58%); border:2px solid #cce7dd}
  .sun{position:absolute; width:82px;height:82px;border-radius:50%;background:#ffe69b;right:35px;top:28px;box-shadow:0 0 0 12px rgba(255,230,155,.25)}
  .cloud{position:absolute;background:white;border-radius:50px;width:120px;height:34px;opacity:.8}
  .cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%}
  .cloud:before{width:45px;height:45px;left:18px;top:-20px}.cloud:after{width:60px;height:60px;right:15px;top:-30px}
  .c1{top:75px;left:8%}.c2{top:145px;right:18%;transform:scale(.7)}
  .soil{position:absolute;bottom:0;left:0;right:0;height:40%;background:#a87955;border-top:8px solid #8d6347}
  .plant{position:absolute;bottom:47px;left:50%;transform:translateX(-50%);width:190px;height:250px;display:flex;justify-content:center;align-items:flex-end}
  .stem{width:11px;height:145px;background:#4f9a67;border-radius:10px;position:absolute;bottom:20px}
  .leaf{position:absolute;width:75px;height:38px;background:#6dbb7b;border-radius:100% 0 100% 0;transform-origin:right center}
  .leaf.l{right:50%;bottom:115px;transform:rotate(22deg)} .leaf.r{left:50%;bottom:80px;transform:scaleX(-1) rotate(25deg)}
  .flower{position:absolute;bottom:145px;width:78px;height:78px;animation:bob 3s ease-in-out infinite}
  .petal{position:absolute;width:38px;height:38px;background:var(--pink);border-radius:50%;left:20px;top:20px}
  .p1{transform:translateY(-19px)}.p2{transform:translateX(19px)}.p3{transform:translateY(19px)}
  .p4{transform:translateX(-19px)}.p5{background:#ff9fbb;transform:scale(.75)}
  .center{position:absolute;left:29px;top:29px;width:20px;height:20px;border-radius:50%;background:#ffd96e;z-index:2}
  @keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
  .panel{margin-top:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
  .prompt{font-size:1.15rem;font-weight:800}.choices{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
  button{font:inherit;border:0;cursor:pointer;color:var(--ink);font-weight:800}
  .mood{padding:10px 13px;border-radius:15px;background:#f4eff8;border:2px solid transparent;transition:.18s}
  .mood:hover{transform:translateY(-2px)} .mood.active{border-color:#806a94;background:white;box-shadow:0 5px 12px #00000012}
  .grow{background:#342b3f;color:white;padding:14px 18px;border-radius:17px;min-width:125px;transition:.2s}
  .grow:hover{transform:translateY(-2px);box-shadow:0 8px 18px #342b3f25}
  .message{margin-top:18px;background:#fff7df;border-radius:18px;padding:13px 16px;color:#6e5b35;display:none}
  .stats{display:flex;gap:10px;justify-content:center;margin-top:16px;color:var(--muted);font-size:.9rem}
  @media(max-width:650px){.app{padding:18px}.panel{grid-template-columns:1fr}.grow{width:100%}.garden{height:390px}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div><h1>🌷 Sprinkle</h1><p class="sub">A tiny mood garden for tiny wins.</p></div>
    <div class="streak">🌱 <span id="streak">0</span> blooms</div>
  </header>

  <section class="garden" aria-label="Your tiny garden">
    <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="soil"></div>
    <div class="plant">
      <div class="stem"></div><div class="leaf l"></div><div class="leaf r"></div>
      <div class="flower" id="flower">
        <i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i>
        <i class="petal p4"></i><i class="petal p5"></i><i class="center"></i>
      </div>
    </div>
  </section>

  <section class="panel">
    <div>
      <div class="prompt">How are you feeling right now?</div>
      <div class="choices">
        <button class="mood active" data-mood="sunny">☀️ Sunny</button>
        <button class="mood" data-mood="cozy">🧸 Cozy</button>
        <button class="mood" data-mood="sparkly">✨ Sparkly</button>
        <button class="mood" data-mood="sleepy">🌙 Sleepy</button>
        <button class="mood" data-mood="stormy">🌧️ Stormy</button>
      </div>
    </div>
    <button class="grow" id="grow">Grow a bloom</button>
  </section>
  <div class="message" id="message"></div>
  <div class="stats">Every click adds a little garden magic. 🌿</div>
</main>

<script>
  const messages = {
    sunny:["The garden noticed your good energy. 🌞","A sunny feeling deserves a sunny flower!"],
    cozy:["Soft day, soft flower. 🧸","You’re allowed to take it easy today."],
    sparkly:["✨ Maximum sparkle detected.","That feeling looks excellent on you."],
    sleepy:["A sleepy bloom still counts. 🌙","Rest is part of growing, too."],
    stormy:["Even storm clouds help gardens grow. 🌧️","One tiny step is enough for today."]
  };
  let mood="sunny", blooms=Number(localStorage.getItem("sprinkle-blooms")||0);
  const streak=document.getElementById("streak"), message=document.getElementById("message"), flower=document.getElementById("flower");
  streak.textContent=blooms;

  document.querySelectorAll(".mood").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".mood").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active"); mood=btn.dataset.mood;
    });
  });

  document.getElementById("grow").addEventListener("click",()=>{
    blooms++; localStorage.setItem("sprinkle-blooms",blooms); streak.textContent=blooms;
    const list=messages[mood], text=list[Math.floor(Math.random()*list.length)];
    message.textContent=text; message.style.display="block";
    flower.animate([{transform:"translateY(0) scale(1)"},{transform:"translateY(-18px) scale(1.08)"},{transform:"translateY(0) scale(1)"}],
      {duration:650,easing:"cubic-bezier(.2,.8,.2,1)"});
    for(let i=0;i<7;i++){
      const s=document.createElement("span"); s.textContent="✦";
      s.style.cssText=`position:absolute;left:${45+Math.random()*10}%;bottom:${35+Math.random()*35}%;font-size:${10+Math.random()*12}px;opacity:0;pointer-events:none;`;
      document.querySelector(".garden").appendChild(s);
      s.animate([{opacity:0,transform:"translateY(0) scale(.5)"},{opacity:1,transform:"translateY(-35px) scale(1)"},{opacity:0,transform:"translateY(-65px) scale(.7)"}],
        {duration:900,delay:i*35}).onfinish=()=>s.remove();
    }
  });
</script>
</body>
</html>
